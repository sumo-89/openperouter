# Default values for openperouter.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

rbac:
  # create specifies whether to install and use RBAC rules.
  create: true

openperouter:
  # -- Controller log level. Must be one of: `debug`, `info`, `warn` or `error`.
  logLevel: info
  # -- Maximum number of dynamic BGP sessions accepted via underlay listen
  # ranges (FRR `bgp listen limit`, 1-65535).
  bgpListenLimit: 65535
  # -- If true, enables host mode deployment: deploys hostbridge DaemonSet instead of router and controller,
  # and configures nodemarker to run in webhook-only mode
  hostmode: false
  image:
    repository: quay.io/openperouter/router
    tag: ""
    pullPolicy: ""
  ## ref: https://kubernetes.io/docs/tasks/manage-daemon/update-daemon-set/
  ##
  updateStrategy:
    ## StrategyType
    ## Can be set to RollingUpdate or OnDelete
    ##
    type: RollingUpdate
  serviceAccounts:
    # Specifies whether the ServiceAccounts should be created
    create: true
    # The names of the ServiceAccounts to use. If not set and create is
    # true, a name is generated using the fullname template
    controller:
      name: ""
    nodemarker:
      name: ""
    perouter:
      name: ""
    annotations: {}
  # -- Node selector to constrain all openperouter pods (router, controller,
  # nodemarker, hostbridge) to nodes with matching labels.
  nodeSelector: {}
  # -- Tolerations for all openperouter pods (router, controller, nodemarker,
  # hostbridge). Defaults to tolerating control-plane/master node taints so
  # the pods can run there.
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  # -- Priority class for all openperouter pods (router, controller,
  # nodemarker, hostbridge). The router carries the node's traffic and the
  # nodemarker serves the validating webhooks, so use system-node-critical
  # (or system-cluster-critical): the kubelet and the descheduler do not evict
  # pods of these classes for node pressure. A user-defined PriorityClass only
  # orders scheduling preemption. Some clusters admit the system classes only in
  # namespaces with a matching ResourceQuota.
  priorityClassName: ""
  # -- Affinity rules for all openperouter pods (router, controller,
  # nodemarker, hostbridge).
  affinity: {}
  ## Selects which runtime class will be used by the pod.
  runtimeClassName: ""
  podAnnotations: {}
  labels: {}
  controller:
    # -- Resources of the controller container. Without a CPU request the pod is
    # BestEffort and a reconciliation gets almost no CPU on a busy node.
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
    # -- Health probe port for liveness and readiness checks
    healthProbePort: 9081
    # -- CNI plugin binary directories. The default matches the path baked into
    # the controller image. Override only to use externally-provided binaries
    # (e.g. host-mounted).
    cniPluginDirs:
      - "/opt/openperouter/cni/bin/"
    # -- CNI cache directory for persistent CNI state across pod restarts
    cniCacheDir: "/var/lib/openperouter/cni/cache"
  nodemarker:
    # -- Resources of the nodemarker container. It serves every admission call for
    # the openperouter resources, so a CPU request keeps the webhooks responsive
    # on a busy node.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
  # frr contains configuration specific to the perouter FRR container,
  frr:
    image:
      repository: quay.io/openperouter/openperouter
      tag: ""
      pullPolicy: ""
    # -- Resources of the frr container. A CPU request keeps BGP and BFD timely on
    # a busy node. No memory limit by default: an OOM kill restarts FRR.
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
    reloader:
      # -- Resources of the reloader container, which applies every configuration
      # change. No memory limit by default: a kill during a reload leaves FRR
      # partially configured until the next reconciliation.
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
      # -- Timeout for vtysh commands used in health checks. Increase under heavy VNI load. Defaults to 10s.
      vtyshTimeout: ""
  # -- Datapath to use for L3 forwarding. "kernel" uses the standard Linux
  # kernel datapath; "grout" adds a DPDK-accelerated sidecar that runs
  # alongside FRR (FRR's dplane_grout module syncs routes automatically).
  datapath: "kernel"
  # grout contains configuration for the grout DPDK dataplane sidecar.
  # Only used when datapath is set to "grout".
  grout:
    # -- Run grout in test mode. Test mode requires no hugepages and uses dummy
    # FIB algorithms, which keeps memory usage low at the cost of real longest
    # prefix match lookups. Leave it disabled for a hugepage-backed dataplane,
    # requesting hugepages under grout.resources.
    testMode: false
    image:
      repository: quay.io/openperouter/router
      tag: "main-grout"
      pullPolicy: ""
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "500m"
  # -- OVS database socket path. Defaults to standard OVS location if not specified.
  ovsSocketPath: ""
  # -- OVS run directory to mount. This is the directory containing the OVS socket.
  ovsRunDir: "/var/run/openvswitch"

webhook:
  enabled: true

crds:
  enabled: true
  validationFailurePolicy: Fail
