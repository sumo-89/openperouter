<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Two L2VNIs sharing one OVS bridge, separated by access VLAN</title>
  <rect width="920" height="460" fill="#ffffff"/>

  <!-- node frame -->
  <rect x="16" y="16" width="888" height="428" rx="10" fill="none" stroke="#9aa5b1" stroke-dasharray="6 4"/>
  <text x="32" y="40" fill="#52606d" font-weight="bold">PE worker node</text>

  <!-- workloads -->
  <rect x="40" y="80" width="170" height="56" rx="6" fill="#e3f2fd" stroke="#1e88e5"/>
  <text x="125" y="103" text-anchor="middle" font-weight="bold">workload wl11</text>
  <text x="125" y="122" text-anchor="middle" fill="#334e68">192.168.11.10/24</text>
  <rect x="40" y="320" width="170" height="56" rx="6" fill="#fff3e0" stroke="#fb8c00"/>
  <text x="125" y="343" text-anchor="middle" font-weight="bold">workload wl12</text>
  <text x="125" y="362" text-anchor="middle" fill="#334e68">192.168.12.10/24</text>

  <!-- br-wl (stand-in for br-int) -->
  <rect x="250" y="70" width="150" height="316" rx="8" fill="#f5f7fa" stroke="#52606d"/>
  <text x="325" y="94" text-anchor="middle" font-weight="bold">br-wl</text>
  <text x="325" y="112" text-anchor="middle" fill="#52606d" font-size="11">stand-in for br-int</text>
  <text x="325" y="126" text-anchor="middle" fill="#52606d" font-size="11">(OVN localnet pushes the tag)</text>
  <line x1="210" y1="108" x2="262" y2="160" stroke="#1e88e5" stroke-width="2"/>
  <rect x="262" y="150" width="126" height="26" rx="4" fill="#ffffff" stroke="#1e88e5"/>
  <text x="325" y="168" text-anchor="middle" font-size="12">access tag 11</text>
  <line x1="210" y1="348" x2="262" y2="296" stroke="#fb8c00" stroke-width="2"/>
  <rect x="262" y="284" width="126" height="26" rx="4" fill="#ffffff" stroke="#fb8c00"/>
  <text x="325" y="302" text-anchor="middle" font-size="12">access tag 12</text>

  <!-- trunk patch -->
  <line x1="400" y1="228" x2="480" y2="228" stroke="#52606d" stroke-width="4"/>
  <text x="440" y="216" text-anchor="middle" font-size="12">patch</text>
  <text x="440" y="250" text-anchor="middle" font-size="11" fill="#52606d">802.1Q trunk</text>
  <text x="440" y="264" text-anchor="middle" font-size="11" fill="#52606d">VLAN 11 + 12</text>

  <!-- br-data shared -->
  <rect x="480" y="70" width="170" height="316" rx="8" fill="#f5f7fa" stroke="#52606d" stroke-width="2"/>
  <text x="565" y="94" text-anchor="middle" font-weight="bold">br-data</text>
  <text x="565" y="112" text-anchor="middle" fill="#52606d" font-size="11">shared OVS bridge</text>
  <text x="565" y="126" text-anchor="middle" fill="#52606d" font-size="11">lifecycle: External</text>
  <rect x="496" y="150" width="138" height="40" rx="4" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
  <text x="565" y="166" text-anchor="middle" font-size="12">host-e-110</text>
  <text x="565" y="182" text-anchor="middle" font-size="11" fill="#1e88e5">tag 11 (set by controller)</text>
  <rect x="496" y="270" width="138" height="40" rx="4" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
  <text x="565" y="286" text-anchor="middle" font-size="12">host-e-120</text>
  <text x="565" y="302" text-anchor="middle" font-size="11" fill="#fb8c00">tag 12 (set by controller)</text>

  <!-- router side -->
  <rect x="700" y="70" width="190" height="316" rx="8" fill="#eef7ee" stroke="#43a047"/>
  <text x="795" y="94" text-anchor="middle" font-weight="bold">router netns</text>
  <line x1="634" y1="170" x2="712" y2="170" stroke="#1e88e5" stroke-width="2"/>
  <rect x="712" y="140" width="166" height="62" rx="4" fill="#ffffff" stroke="#1e88e5"/>
  <text x="795" y="158" text-anchor="middle" font-size="12">L2VNI a110 (VNI 110)</text>
  <text x="795" y="174" text-anchor="middle" font-size="11">gw 192.168.11.1/24</text>
  <text x="795" y="190" text-anchor="middle" font-size="11">VRF red</text>
  <line x1="634" y1="290" x2="712" y2="290" stroke="#fb8c00" stroke-width="2"/>
  <rect x="712" y="260" width="166" height="62" rx="4" fill="#ffffff" stroke="#fb8c00"/>
  <text x="795" y="278" text-anchor="middle" font-size="12">L2VNI b120 (VNI 120)</text>
  <text x="795" y="294" text-anchor="middle" font-size="11">gw 192.168.12.1/24</text>
  <text x="795" y="310" text-anchor="middle" font-size="11">VRF blue</text>

  <!-- legend -->
  <text x="40" y="420" font-size="12" fill="#334e68">The new field L2VNI.spec.hostMaster.ovsBridge.vlanID makes each host-e-&lt;vni&gt; port an access port on the shared bridge,</text>
  <text x="40" y="436" font-size="12" fill="#334e68">so two L2VNIs can share br-data and stay isolated. Without it the port is an untagged trunk and VLANs leak.</text>
</svg>
